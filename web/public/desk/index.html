<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Desk · Akshay Anand</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      background: #f3f4f6;
      background-image:
        linear-gradient(to right, rgba(17,17,17,.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(17,17,17,.045) 1px, transparent 1px);
      background-size: 32px 32px;
      color: #111;
      font-family: "Inter Tight", sans-serif;
    }
    main { width: min(720px, calc(100% - 2rem)); margin: 3rem auto 4rem; }
    a { color: inherit; }
    h1 { margin: 0 0 .4rem; font-size: 2.4rem; letter-spacing: -.04em; }
    p { color: #6b7280; }
    form, .list, .status, .token {
      background: #fff;
      border: 1px solid #e6e7eb;
      padding: 1rem;
    }
    form { display: flex; gap: .5rem; margin-top: 1rem; }
    input {
      flex: 1;
      border: 1px solid #e6e7eb;
      padding: .7rem .8rem;
      font: inherit;
      outline: none;
      min-width: 0;
    }
    input:focus { border-color: #111; }
    button, .text {
      border: 0;
      background: #f5c518;
      color: #111;
      padding: .7rem 1rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: progress; }
    .text { background: transparent; padding: 0; font-weight: 500; text-decoration: underline; }
    .token { margin-top: 1rem; }
    .token label { display: block; margin-bottom: .4rem; font-size: .92rem; }
    .list { margin-top: 1rem; }
    li { padding: .7rem 0; border-top: 1px solid #e6e7eb; overflow-wrap: anywhere; }
    .status { margin-top: 1rem; color: #6b7280; font-family: "JetBrains Mono", monospace; font-size: .78rem; }
    .bad { color: #e8590c; }
    .row { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
  </style>
</head>
<body>
  <main>
    <div class="row">
      <h1>Desk</h1>
      <a href="/">Site</a>
    </div>
    <p>Paste a Medium or Hashnode link. The story is pulled in and published on the blog.</p>
    <div class="token">
      <label for="token">GitHub token, kept in this browser</label>
      <input id="token" type="password" autocomplete="off" placeholder="github_pat_…" />
      <p>It needs permission to edit this repository. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noreferrer">Create a fine-grained token</a> for Akshay-Anand010.github.io with Contents set to Read and write.</p>
    </div>
    <form>
      <input name="url" type="url" required placeholder="https://medium.com/@you/story or https://you.hashnode.dev/story" />
      <button type="submit">Add</button>
    </form>
    <div class="status" hidden></div>
    <div class="list"></div>
  </main>
  <script>
    const repo = "Akshay-Anand010/Akshay-Anand010.github.io";
    const filePath = "web/sources.txt";
    const tokenInput = document.querySelector("#token");
    const status = document.querySelector(".status");
    const list = document.querySelector(".list");
    const form = document.querySelector("form");
    const saved = localStorage.getItem("desk-token") || "";
    tokenInput.value = saved;

    function show(text, bad) {
      status.hidden = false;
      status.className = bad ? "status bad" : "status";
      status.textContent = text;
    }

    function linksFrom(text) {
      return text.split("\n").map((line) => line.trim()).filter((line) => line && !line.startsWith("#"));
    }

    function decode(content) {
      const binary = atob(content.replace(/\n/g, ""));
      const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function encode(text) {
      const bytes = new TextEncoder().encode(text);
      let binary = "";
      for (const byte of bytes) binary += String.fromCharCode(byte);
      return btoa(binary);
    }

    function render(links) {
      list.replaceChildren();
      if (!links.length) {
        const empty = document.createElement("p");
        empty.textContent = "No links yet.";
        list.append(empty);
        return;
      }
      const ul = document.createElement("ul");
      for (const url of links) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.rel = "noreferrer";
        a.textContent = url;
        li.append(a);
        ul.append(li);
      }
      list.append(ul);
    }

    async function readFile(token) {
      const headers = { Accept: "application/vnd.github+json" };
      if (token) headers.Authorization = `Bearer ${token}`;
      const response = await fetch(`https://api.github.com/repos/${repo}/contents/${filePath}`, { headers });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || "Could not read the link list.");
      return { text: decode(data.content), sha: data.sha };
    }

    async function load() {
      try {
        const file = await readFile("");
        render(linksFrom(file.text));
      } catch (error) {
        show(error.message, true);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const url = new FormData(form).get("url").trim();
      const token = tokenInput.value.trim();
      let parsed;
      try {
        parsed = new URL(url);
      } catch {
        show("That is not a link.", true);
        return;
      }
      if (parsed.protocol !== "https:" && parsed.protocol !== "http:") {
        show("Use an http or https link.", true);
        return;
      }
      if (!token) {
        show("Paste a GitHub token first. It stays in this browser.", true);
        tokenInput.focus();
        return;
      }
      localStorage.setItem("desk-token", token);
      const button = form.querySelector("button");
      button.disabled = true;
      show("Saving the link…");
      try {
        const file = await readFile(token);
        const links = linksFrom(file.text);
        const key = parsed.href.replace(/\/$/, "");
        if (links.some((item) => item.replace(/\/$/, "") === key)) {
          show("That link is already on the list.");
          return;
        }
        const next = `${file.text.replace(/\s*$/, "")}\n${parsed.href}\n`;
        const response = await fetch(`https://api.github.com/repos/${repo}/contents/${filePath}`, {
          method: "PUT",
          headers: {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            message: "Add a blog link from the desk.",
            content: encode(next),
            sha: file.sha,
            branch: "main",
          }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || "GitHub did not save the link.");
        show("Saved. The story will show on the blog after GitHub finishes building.");
        form.reset();
        render(linksFrom(next));
      } catch (error) {
        show(error.message, true);
      } finally {
        button.disabled = false;
      }
    });

    load();
  </script>
</body>
</html>
