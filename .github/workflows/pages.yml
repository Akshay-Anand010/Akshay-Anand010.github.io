name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these permissions to publish the site folder. The workflow
# does not train the model. Training stays in Colab because Actions has no GPU.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the new repo
        uses: actions/checkout@v4

      - name: Check that the life notes still build
        run: python3 data/build_examples.py

      - name: Upload the website folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
